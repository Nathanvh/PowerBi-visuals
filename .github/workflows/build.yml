name: build

# Push naar main -> alle visuals bouwen, .pbiviz als download bij Actions (Artifacts).
# Staat het versienummer in visuals/<naam>/pbiviz.json nog niet als Release, dan wordt
# automatisch tag <naam>-v<versie> + Release met het .pbiviz-bestand gemaakt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lijst:
    runs-on: ubuntu-latest
    outputs:
      visuals: ${{ steps.m.outputs.visuals }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "visuals=$(ls -d visuals/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  bouw:
    needs: lijst
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual: ${{ fromJson(needs.lijst.outputs.visuals) }}
    defaults:
      run:
        working-directory: visuals/${{ matrix.visual }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visuals/${{ matrix.visual }}/package-lock.json
      - run: npm ci
      - run: npx pbiviz package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.visual }}
          path: visuals/${{ matrix.visual }}/dist/*.pbiviz

  release:
    if: github.event_name != 'pull_request'
    needs: bouw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bestanden
      - name: Nieuwe versies als Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in visuals/*/; do
            v=$(basename "$dir")
            versie=$(jq -r '.visual.version' "$dir/pbiviz.json" | sed 's/\.0$//')
            tag="$v-v$versie"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag bestaat al, overslaan"
            else
              gh release create "$tag" bestanden/"$v"/*.pbiviz --target "$GITHUB_SHA" --title "$tag" --generate-notes
            fi
          done
